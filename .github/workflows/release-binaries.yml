name: Release Windows Executable

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build & Publish AgentOS.exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build standalone executable (AgentOS.spec)
        run: |
          python -m PyInstaller --clean AgentOS.spec

      - name: Verify build artifacts
        run: |
          if (-not (Test-Path "dist\AgentOS.exe")) {
            Write-Error "dist\AgentOS.exe was not generated."
            exit 1
          }
          $item = Get-Item "dist\AgentOS.exe"
          Write-Host "Generated: $($item.FullName) ($([math]::Round($item.Length / 1MB, 2)) MB)"

      - name: Safe Authenticode Code-Signing verification
        env:
          AGENTOS_SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
          AGENTOS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          python -m agentos.security.code_signing dist/AgentOS.exe

      - name: Generate SHA-256 Checksum
        run: |
          python -c "import hashlib; h = hashlib.sha256(open('dist/AgentOS.exe','rb').read()).hexdigest(); open('dist/AgentOS.exe.sha256','w').write(f'{h}  AgentOS.exe\n'); print(f'SHA256: {h}')"

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/AgentOS.exe
            dist/AgentOS.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
