apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentos-supervisor
  namespace: agentos
  labels:
    app.kubernetes.io/name: agentos
    app.kubernetes.io/component: supervisor
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos
    spec:
      # Principle: Least privilege, no root, read-only rootfs
      serviceAccountName: agentos-service-account
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentos-engine
          image: agentos:3.0.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          env:
            - name: AGENTOS_ENV
              value: "production"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: workspace-volume
              mountPath: /app/workspace
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: agentos-data-pvc
        - name: workspace-volume
          persistentVolumeClaim:
            claimName: agentos-workspace-pvc
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
