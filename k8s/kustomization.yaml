apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentos

labels:
  - pairs:
      app.kubernetes.io/name: agentos
      app.kubernetes.io/part-of: agentos
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - network-policy.yaml

images:
  - name: agentos
    newName: ghcr.io/korisipati-charan/agentos
    newTag: 3.0.1
