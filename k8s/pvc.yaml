apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-data-pvc
  namespace: agentos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentos-workspace-pvc
  namespace: agentos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
