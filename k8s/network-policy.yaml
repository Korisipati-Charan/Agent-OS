apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentos-default-deny-egress
  namespace: agentos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentos
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Trust only the ingress controller pods in the ingress-nginx namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow cluster DNS only. All other egress remains denied until a
    # destination-aware egress gateway or CNI FQDN policy is configured.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
