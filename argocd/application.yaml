apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentos-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: agentos
    app.kubernetes.io/part-of: agentos
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: agentos-project
  source:
    repoURL: "https://github.com/Korisipati-Charan/Agent-OS.git"
    targetRevision: "main"
    path: "k8s"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "agentos"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
